name: opportunity-watcher

# Runs on GitHub's servers every 30 minutes, even when your computer is off.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opportunity-watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check J&J careers
        run: node watcher.mjs
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!NOTIFY.txt'
          git diff --staged --quiet || git commit -m "status @ $(date -u +%FT%TZ)"
          git push
      - name: Email owner on new role
        if: always()
        run: |
          if [ -f NOTIFY.txt ]; then
            echo "::error title=NEW J&J ROLE::$(cat NOTIFY.txt)"
            exit 1
          fi
          echo "no new role this run"
